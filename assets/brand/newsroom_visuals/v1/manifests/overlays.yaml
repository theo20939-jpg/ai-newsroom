  - id: data_minimal_02
    path: overlays/data/data_minimal_02.png
    presentation_type: DATA
    priority: 2
    aspect_ratio: 0.8003
    has_alpha: true
    contains_trusted_branding: false
    active: true
    asset_role: design_reference
    production_runtime_asset: false
    notes: >
      Red palette. Small ascending trend-line/data-point chart merged into the left end of the
