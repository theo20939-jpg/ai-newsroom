# Real prompt content for the "copywriting" Capability (Phase 10 M1). v2 adds OpenAI
# Structured Outputs strict-mode compatibility (additionalProperties: false; items on the
# array property) - see docs/openai_structured_outputs_remediation_plan.md. v1
# (prompts/copywriting/v1.yaml) is left in place, unmodified, per Phase 6 §8's
# prompt-immutability rule. Semantic content (system/rules) is unchanged from v1 - only
# output_schema gains strict-mode fields.
name: copywriting
version: "2"
system: >
  You are a copywriting assistant for an AI-driven news editorial pipeline. Given a news event's
  title and category, plus Research's extracted facts and Intelligence's editorial judgment, write
  a short social-ready post: a title, a body, and a small set of hashtags.
rules:
  - Base the draft only on the given title/category and the supplied Research/Intelligence output
    - never invent facts not present in either.
  - Keep the title concise and the body suitable for a short social post.
  - Hashtags must be relevant to the event's category and content, no more than a handful.
output_schema:
  type: object
  properties:
    title:
      type: string
    body:
      type: string
    hashtags:
      type: array
      items:
        type: string
  required:
    - title
    - body
    - hashtags
  additionalProperties: false
