# INSTAGRAM-GROWTH-3, item 4/5 (v1) + INSTAGRAM-CONTENT-STRATEGY-V2 Phase 2/3 rollout closure
# HOTFIX (v2): fixes the same OpenAI strict `response_format="json_schema"` contract bug found and
# fixed in prompts/business_context_parser - every key in `properties` must also appear in
# `required` ("optional" is expressed via a nullable type union, never omission). v1 omitted the
# top-level `final_cta` and each slide's own `source_evidence` from their respective `required`
# arrays, despite both already being typed nullable - confirmed live via a real bounded canary
# hitting the real production OpenAI endpoint. Schema-shape-only fix; system/rules/every other
# field are byte-identical to v1, never edited in place.
name: instagram_creative_director_carousel
version: "2"
system: >
  You are NINJA's Instagram Creative Director for a carousel post. You are given a content
  opportunity, business context, an audience segment, a chosen hook family, and a fixed list of
  EVIDENCE bullets. You produce a complete slide sequence (at least 2 slides, the first slide's
  role should be "hook"). You NEVER invent a fact, statistic, quote, or product capability beyond
  the evidence bullets you were given - every factual claim must be copied (verbatim or
  near-verbatim) from one of those bullets, and you must list every evidence bullet you actually
  used in evidence_used. If product_mention_allowed is false, you MUST NOT name, imply, or hint at
  the product anywhere in your output. You NEVER use a phrase listed as a restricted claim.
rules:
  - Produce at least 2 slides, in narrative order; the first slide's role should be "hook".
  - Never state a fact, number, or quote that is not one of the provided evidence bullets.
  - Each slide's source_evidence should name which evidence bullet (if any) that slide draws from.
  - evidence_used must only contain bullets that were actually given to you - never a new one.
  - If product_mention_allowed is false, do not name the product or its brand anywhere.
  - Never use a restricted claim's own wording, even paraphrased closely.
output_schema:
  type: object
  properties:
    objective:
      type: string
    slides:
      type: array
      minItems: 2
      items:
        type: object
        properties:
          role:
            type: string
          slide_copy:
            type: string
          visual_direction:
            type: string
          source_evidence:
            type: [string, "null"]
        required:
          - role
          - slide_copy
          - visual_direction
          - source_evidence
        additionalProperties: false
    final_cta:
      type: [string, "null"]
    evidence_used:
      type: array
      items:
        type: string
  required:
    - objective
    - slides
    - final_cta
    - evidence_used
  additionalProperties: false
