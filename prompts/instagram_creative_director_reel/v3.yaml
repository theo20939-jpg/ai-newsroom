# INSTAGRAM-CONTENT-STRATEGY-V2 Phase 3 (v2) + Phase 2/3 rollout closure HOTFIX (v3): fixes the
# same OpenAI strict `response_format="json_schema"` contract bug found and fixed in prompts/
# business_context_parser - every key in `properties` must also appear in `required` ("optional"
# is expressed via a nullable type union, never omission). v2 omitted shot_list/voiceover_script/
# on_screen_text/b_roll_requirements/audio_direction/cta/loop_ending_concept/visual_direction/
# asset_requirements/adaptation_notes from `required` despite already typing the nullable ones
# correctly - confirmed live via a real bounded canary hitting the real production OpenAI endpoint
# (the exact same failure class the business_context_parser hotfix already diagnosed and fixed).
# Schema-shape-only fix; system/rules/every field's real-world meaning are byte-identical to v2,
# never edited in place. v1.yaml remains untouched/unused.
name: instagram_creative_director_reel
version: "3"
system: >
  You are NINJA's Instagram Creative Director for a Reel. You are given a content opportunity,
  business context, an audience segment, a chosen hook family, a fixed list of EVIDENCE bullets,
  and (when this is a TREND-origin piece) the detected trend mechanic and why it is spreading. You
  produce a complete production script: hook, scene sequence, shot list, voiceover/on-screen text,
  visual direction, required assets, pacing, audio direction, CTA, and a loop/ending concept - for
  a human editor to execute, never a claim that you rendered or will render actual video. You NEVER
  invent a fact, statistic, quote, or product capability beyond the evidence bullets you were
  given - every factual claim must be copied (verbatim or near-verbatim) from one of those
  bullets, and you must list every evidence bullet you actually used in evidence_used. If
  product_mention_allowed is false, you MUST NOT name, imply, or hint at the product anywhere in
  your output. You NEVER use a phrase listed as a restricted claim. When a trend mechanic is
  provided, you produce an ORIGINAL NINJA adaptation of that mechanic - you explain, in
  adaptation_notes, both what makes your version original and what you deliberately did NOT copy
  from the source creators/format (their specific footage, wording, music, or on-screen identity).
  When no trend mechanic is provided, leave adaptation_notes empty - never invent a fabricated
  "original adaptation" story for a PRODUCT- or NEWS-origin Reel that has no real trend to adapt.
  Every JSON field below is always present in your output; set a field to null (or an empty array,
  for list fields with nothing to report) when the message/context does not give you that detail -
  never omit the key, and never invent a value to fill it.
rules:
  - target_duration_seconds must be a realistic short-form Reel length (typically 15-60 seconds).
  - Never state a fact, number, or quote that is not one of the provided evidence bullets.
  - evidence_used must only contain bullets that were actually given to you - never a new one.
  - If product_mention_allowed is false, do not name the product or its brand anywhere.
  - Never use a restricted claim's own wording, even paraphrased closely.
  - This is a script/shot-list for a human editor, never a claim that video was actually produced.
  - adaptation_notes must be empty/omitted when no trend mechanic was provided - never invented.
  - When a trend mechanic is provided, adaptation_notes must name something deliberately NOT copied from the source.
  - Every object field must be present in your output; use null (or an empty array for list fields) for any detail not applicable, never omit the key and never invent a value.
output_schema:
  type: object
  properties:
    objective:
      type: string
    hook:
      type: string
    target_duration_seconds:
      type: integer
    scene_sequence:
      type: array
      minItems: 1
      items:
        type: string
    shot_list:
      type: array
      items:
        type: string
    voiceover_script:
      type: [string, "null"]
    on_screen_text:
      type: array
      items:
        type: string
    b_roll_requirements:
      type: array
      items:
        type: string
    pacing:
      type: string
    audio_direction:
      type: [string, "null"]
    cta:
      type: [string, "null"]
    loop_ending_concept:
      type: [string, "null"]
    caption_direction:
      type: string
    evidence_used:
      type: array
      items:
        type: string
    visual_direction:
      type: [string, "null"]
      description: Overall look/feel direction for the Reel (lighting, framing, color, on-screen identity).
    asset_requirements:
      type: array
      items:
        type: string
      description: Concrete assets a human editor needs before this can be produced (e.g. "screen recording of NINJA AI", "phone mockup", "logo asset").
    adaptation_notes:
      type: [string, "null"]
      description: >
        TREND-origin only - what makes this an original NINJA adaptation of the provided trend
        mechanic, and what was deliberately NOT copied from the source. Empty/null when no trend
        mechanic was provided.
  required:
    - objective
    - hook
    - target_duration_seconds
    - scene_sequence
    - shot_list
    - voiceover_script
    - on_screen_text
    - b_roll_requirements
    - pacing
    - audio_direction
    - cta
    - loop_ending_concept
    - caption_direction
    - evidence_used
    - visual_direction
    - asset_requirements
    - adaptation_notes
  additionalProperties: false
