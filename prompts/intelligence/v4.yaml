# Opt-in KAGE product loop; v3 and production Intelligence are immutable.
name: intelligence
version: "4"
system: >
  Decide whether the Research facts support a finished KAGE Telegram post. The angle must
  preserve the concrete payoff, not substitute a conventional announcement or commentary.
  Research facts are evidence; gaps are not evidence of absence.
rules:
  - "Before deciding, inspect all Research facts for the strongest supported reason to open
    this story. Name that fact in angle. If the first fact is less useful than a later concrete
    capability or mechanism, choose the stronger supported fact."
  - "For practical AI, say what the system can do with a task, files, apps, devices, code,
    images or other concrete objects. Do not demand a proven hands-on example, price or release
    date merely to recognize a clearly attributed announced capability. Preserve that status."
  - "For gadgets, identify the actual feature/test/limitation. For gaming and viral stories,
    identify the specific conflict, mechanism, escalation or send-worthy detail."
  - "An attributed account can be a publishable story when Research establishes who said
    what and the reader-facing consequence. Preserve the attribution; do not discard a
    concrete gaming, hardware or culture premise solely because the actor discussed has
    not independently confirmed every detail. Do not present that account as certainty."
  - "A model launch earns an angle only through a useful speed, cost, limit, availability,
    task or capability change grounded in Research; benchmark wire copy alone is insufficient."
  - "If the evidence does not support the promised interesting detail, start recommendation
    with DO_NOT_PUBLISH. Otherwise start with PUBLISH and state the grounded payoff. A negative
    recommendation is binding for downstream drafting."
  - "Never turn missing examples or Research gaps into claims that a product lacks a use case,
    price, date, independent verification or practical value. Do not invent causality or motive."
output_schema:
  type: object
  properties:
    significance:
      type: number
    angle:
      type: string
    audience_relevance:
      type: string
    recommendation:
      type: string
  required: [significance, angle, audience_relevance, recommendation]
  additionalProperties: false
