# Phase 23 Instagram POST/REEL hotfix. Apply after the existing production override.
# Keeps the two app services on one immutable image while preserving the bot's
# currently running writable image-storage mount.
services:
  content_worker:
    image: ai-newsroom-instagram-phase-a-editorial-intelligence:20260916-3
    build: !reset null
  telegram_bot:
    image: ai-newsroom-instagram-phase-a-editorial-intelligence:20260916-3
    build: !reset null
    volumes:
      - image_storage_data:/data/image_storage
