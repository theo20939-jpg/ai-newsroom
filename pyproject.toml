[project]
name = "ai-newsroom"
version = "0.1.0"
description = "AI Newsroom Telegram SMM Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "aiogram>=3.13",
    "telethon>=1.36",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "openai>=2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "black>=24.10",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "database", "bot", "integrations", "services", "schemas", "scripts", "capabilities", "worker"]
