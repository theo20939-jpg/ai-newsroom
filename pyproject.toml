[project]
name = "ai-newsroom"
version = "0.1.0"
description = "AI Newsroom Telegram SMM Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "aiogram>=3.13",
    "telethon>=1.36",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "openai>=2.40",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "black>=24.10",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "database", "bot", "integrations", "services", "schemas", "scripts", "capabilities", "worker"]

[tool.pytest.ini_options]
# Phase V2.10Q: `tests/` is intentionally NOT in the wheel packages list above (it is test-only
# source, never shipped) and has no `__init__.py` (a plain PEP 420 namespace package). Locally,
# `from tests.xxx import ...` only resolves because an editable install happens to put the repo
# root itself on sys.path - a side effect of editable installs, not something a real `pip install
# .` (the Dockerfile's non-editable build) ever provides. Without the repo root on sys.path,
# `import tests.test_content_worker_cycle` fails with "ModuleNotFoundError: No module named
# 'tests'" - confirmed by reproducing the exact error via a direct sys.path manipulation, the same
# failure observed on the VPS ephemeral test image. `pythonpath = ["."]` makes pytest itself put
# the repo root on sys.path before collection, byte-identical fix mechanism, in every invocation
# context (editable or not, "python -m pytest" or bare "pytest", any working directory this value
# is relative to) - no new package file, no production behavior change.
pythonpath = ["."]
