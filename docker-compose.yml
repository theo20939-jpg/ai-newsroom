services:
  backend:
    build: .
    container_name: ai_newsroom_backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./core:/app/core
      - ./database:/app/database

  automation_worker:
    build: .
    container_name: ai_newsroom_automation_worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    command: ["python", "-m", "worker.main"]
    depends_on:
      postgres:
        condition: service_healthy

  news_analysis_worker:
    build: .
    container_name: ai_newsroom_news_analysis_worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["python", "-m", "worker.analysis_main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  content_worker:
    build: .
    container_name: ai_newsroom_content_worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["python", "-m", "worker.content_main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Phase 16 M5: internal image-candidate byte storage (docs/phase16_m5_persistence_and_
      # retention_report.md §10) - a dedicated named volume, not bind-mounted into the repo, not
      # committed to Git. Only content_worker mounts it (least privilege) - it is the only service
      # that writes finalist bytes in M5. A future M6 preview-serving service will need its own
      # mount added explicitly when that need is real, not preemptively here.
      - image_storage_data:/data/image_storage

  telegram_bot:
    build: .
    container_name: ai_newsroom_telegram_bot
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["python", "-m", "bot.main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Same image-candidate byte storage content_worker writes to (docs/phase16_m5_persistence_
      # and_retention_report.md §10) - bot/image_preview_media.py::resolve_photo_input() falls back
      # to services.image_persistence.read_candidate_bytes() (local disk) whenever a candidate has
      # no cached telegram_file_id yet. Read-only: this service never writes image bytes, only
      # content_worker's M5 persistence path does.
      - image_storage_data:/data/image_storage:ro

  postgres:
    image: postgres:16-alpine
    container_name: ai_newsroom_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_newsroom_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  image_storage_data:
