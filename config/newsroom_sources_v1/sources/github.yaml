version: 1
sources:
- id: github_trending
  name: GitHub Trending
  category: github
  type: web_page
  url: https://github.com/trending
  language: en
  region: global
  priority: 88
  reliability: 0.8
  fetch_interval: 1h
  enabled: true
  tags:
  - github
  - open-source
  - trends
  - coding
  adapter: github_trending
- id: openai_github
  name: OpenAI GitHub
  category: github
  type: github_org
  url: https://api.github.com/orgs/openai/repos
  language: en
  region: global
  priority: 95
  reliability: 1.0
  fetch_interval: 1h
  enabled: true
  tags:
  - ai
  - open-source
  - openai
  adapter: github_api
  auth: GITHUB_TOKEN
  metadata:
    repositories:
    - openai/openai-python
    - openai/openai-node
    - openai/codex
    max_releases_per_repo: 10
    include_prereleases: true
- id: anthropics_github
