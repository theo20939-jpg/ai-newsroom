  enabled: true
  tags:
  - ai
  - open-source
  - anthropic
  adapter: github_api
  auth: GITHUB_TOKEN
  metadata:
    repositories:
    - anthropics/anthropic-sdk-python
    - anthropics/anthropic-sdk-typescript
    - anthropics/claude-code
    max_releases_per_repo: 10
    include_prereleases: false
